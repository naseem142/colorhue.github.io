<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Breathing Red Background</title>
        <style>
            * {
                  margin: 0;
                        padding: 0;
                              box-sizing: border-box;
                                  }

                                      body {
                                            width: 100vw;
                                                  height: 100vh;
                                                        background-color: #0d0000; /* Deep dark background */
                                                              overflow: hidden;
                                                                    display: flex;
                                                                          align-items: center;
                                                                                justify-content: center;
                                                                                      cursor: pointer;
                                                                                          }

                                                                                              /* Red breathing layer */
                                                                                                  .glow {
                                                                                                        width: 100%;
                                                                                                              height: 100%;
                                                                                                                    /* Aesthetic deep red color code (#e60000) */
                                                                                                                          background-color: #e60000; 
                                                                                                                                /* Adjust '5s' to make the breathing cycle slower or faster */
                                                                                                                                      animation: breathe 5s ease-in-out infinite alternate;
                                                                                                                                          }

                                                                                                                                              @keyframes breathe {
                                                                                                                                                    0% {
                                                                                                                                                            opacity: 0.1;
                                                                                                                                                                    filter: brightness(0.4) drop-shadow(0 0 0px #e60000);
                                                                                                                                                                          }
                                                                                                                                                                                100% {
                                                                                                                                                                                        opacity: 1;
                                                                                                                                                                                                filter: brightness(1.2) drop-shadow(0 0 50px #ff1a1a);
                                                                                                                                                                                                      }
                                                                                                                                                                                                          }
                                                                                                                                                                                                            </style>
                                                                                                                                                                                                            </head>
                                                                                                                                                                                                            <body onclick="toggleFullscreen()">

                                                                                                                                                                                                              <div class="glow"></div>

                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                    function toggleFullscreen() {
                                                                                                                                                                                                                          if (!document.fullscreenElement) {
                                                                                                                                                                                                                                  document.documentElement.requestFullscreen().catch(err => {});
                                                                                                                                                                                                                                        } else {
                                                                                                                                                                                                                                                document.exitFullscreen().catch(err => {});
                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                            </html>
