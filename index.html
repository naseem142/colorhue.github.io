
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <style>
        body {
              margin: 0;
                    padding: 0;
                          /* CHANGE YOUR COLOR HERE (#ff7f50 = warm coral) */
                                background-color: #ff7f50; 
                                      height: 100vh;
                                            width: 100vw;
                                                  overflow: hidden;
                                                        /* Adjust '4s' to make breathing faster or slower */
                                                              animation: breathe 4s ease-in-out infinite alternate; 
                                                                  }

                                                                      @keyframes breathe {
                                                                            0% {
                                                                                    opacity: 0.15; /* Dim state */
                                                                                            filter: brightness(0.3);
                                                                                                  }
                                                                                                        100% {
                                                                                                                opacity: 1.0;  /* Bright state */
                                                                                                                        filter: brightness(1.1);
                                                                                                                              }
                                                                                                                                  }
                                                                                                                                    </style>
                                                                                                                                    </head>
                                                                                                                                    <body onclick="document.documentElement.requestFullscreen()"></body>
                                                                                                                                    </html>
